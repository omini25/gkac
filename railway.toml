[build]
  builder = "nixpacks"

[deploy]

# ── Backend service ─────────────────────────────────────────────
[services.backend]
  startCommand = "cd backend && npm start"

  [services.backend.build]
    watchPatterns = ["backend/src/**", "backend/package.json"]

  # Persistent volume for uploaded files (images, payment proofs, etc.)
  # With nixpacks, the project root is /app and backend is a subdirectory.
  # The code resolves uploads relative to dist/ -> backend/uploads/
  # Override with UPLOADS_DIR env var if your setup differs.
  [services.backend.volumes]
    "uploads" = "/app/backend/uploads"

# ── Frontend service ────────────────────────────────────────────
[services.frontend]
  startCommand = "cd frontend && npm start"

  [services.frontend.build]
    watchPatterns = ["frontend/src/**", "frontend/package.json"]
