[build]
  builder = "nixpacks"

[deploy]

# ── Backend service ─────────────────────────────────────────────
[services.backend]
  startCommand = "cd backend && npm start"

  [services.backend.build]
    watchPatterns = ["backend/src/**", "backend/package.json"]

  # With nixpacks, the runtime working directory is /app/backend/
  # The code resolves uploads via path.join(__dirname, '..', 'uploads')
  # where __dirname = /app/backend/dist, so it lands at /app/backend/uploads.
  [services.backend.environment]
    UPLOADS_DIR = "/app/backend/uploads"

  # Persistent volume for uploaded files (images, payment proofs, etc.)
  # Must match UPLOADS_DIR above.
  [services.backend.volumes]
    "uploads" = "/app/backend/uploads"

# ── Frontend service ────────────────────────────────────────────
[services.frontend]
  startCommand = "cd frontend && npm start"

  [services.frontend.build]
    watchPatterns = ["frontend/src/**", "frontend/package.json"]
